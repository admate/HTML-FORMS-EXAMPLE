    <title>FORM</title>
</head>

<body>
    <form action="">
        <label for="firstName">Fill in your Full Name</label>
        <input type="text" id="firstName" placeholder="John Doe">
        <br>
        <label for="email">Fill in your Email</label>
        <input type="email" id="email" placeholder="example@gmail.com">
        <br>
        <label for="password">Fill in your Password NOw</label>
        <input type="password" id="password" placeholder="********">
        <br>
        <label for="ageDate">Input your Age</label>
        <input type="date" id="ageDate">
        <br>
        <button>Submit</button>
    </form>
    <br>
